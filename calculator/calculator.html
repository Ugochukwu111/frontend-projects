<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="/calculator/calculator.css">
</head>
<body>

  <main class="calculator">
    <h1>Calculator</h1>

    <input
      type="text"
      class="display"
      placeholder="0"
      readonly
    >

    <div class="buttons">
      <button>C</button>
      <button>+/-</button>
      <button>%</button>
      <button>/</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>*</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>

      <button>0</button>
      <button>.</button>
      <button class="equals">=</button>
    </div>
  </main>

 <script src="/calculator/calculator.js"></script>
</body>
</html>
